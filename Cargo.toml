[workspace]
members = [
    "crates/seiso_cli",
    "crates/seiso_config",
    "crates/seiso_diagnostics",
    "crates/seiso_md",
    "crates/seiso_rules",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/scarletkc/seiso"
publish = true

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
insta = { version = "1.43", features = ["json"] }
markdown = "1.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml = "1.1"
seiso_config = { path = "crates/seiso_config", version = "=0.0.0" }
seiso_diagnostics = { path = "crates/seiso_diagnostics", version = "=0.0.0" }
seiso_md = { path = "crates/seiso_md", version = "=0.0.0" }
seiso_rules = { path = "crates/seiso_rules", version = "=0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = true

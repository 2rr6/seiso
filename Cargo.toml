[workspace]
members = [
    "crates/seiso_cli",
    "crates/seiso_config",
    "crates/seiso_diagnostics",
    "crates/seiso_md",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/scarletkc/seiso"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
insta = { version = "1.43", features = ["json"] }
markdown = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml = "1.1"
seiso_config = { path = "crates/seiso_config" }
seiso_diagnostics = { path = "crates/seiso_diagnostics" }
seiso_md = { path = "crates/seiso_md" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = true

name: Evaluation

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'corpus/**'
      - 'scripts/**'
      - '.github/workflows/evaluation.yml'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Optional Git ref for diagnostic and performance comparison
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASELINE_REF: ${{ inputs.baseline_ref || github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
          persist-credentials: false
      - if: env.BASELINE_REF != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_REF }}
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: current -> target
      - if: env.BASELINE_REF != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: baseline -> target
      - uses: actions/cache@v4
        with:
          path: current/corpus/data/blobs
          key: corpus-${{ hashFiles('current/corpus/corpus.lock.json') }}
      - name: Verify pinned inputs
        working-directory: current
        run: |
          python corpus/corpus.py fetch
          python corpus/corpus.py verify
          python corpus/inventory.py verify
      - name: Evaluate corpus
        run: python current/scripts/evaluate_m2.py --output "$RUNNER_TEMP/evaluation/current"
      - name: Compare diagnostics
        shell: bash
        run: |
          if test -n "$BASELINE_REF"; then
            if test -f baseline/scripts/evaluate_m2.py; then
              python baseline/scripts/evaluate_m2.py --corpus-dir "$GITHUB_WORKSPACE/current/corpus" --output "$RUNNER_TEMP/evaluation/baseline"
              baseline_report="$RUNNER_TEMP/evaluation/baseline/diagnostics.json.gz"
            else
              baseline_report="$GITHUB_WORKSPACE/baseline/corpus/results/m1/promoted-v1/diagnostics.json.gz"
              printf '%s\n' 'Baseline uses the accepted M1 report; that revision has no cross-file evaluator.' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif test -f current/corpus/results/m2/natural-v1/diagnostics.json.gz; then
            baseline_report="$GITHUB_WORKSPACE/current/corpus/results/m2/natural-v1/diagnostics.json.gz"
            printf '%s\n' 'Diagnostic baseline: the recorded M2 corpus run.' >> "$GITHUB_STEP_SUMMARY"
          else
            baseline_report="$GITHUB_WORKSPACE/current/corpus/results/m1/promoted-v1/diagnostics.json.gz"
            printf '%s\n' 'Diagnostic baseline: the recorded M1 corpus run.' >> "$GITHUB_STEP_SUMMARY"
          fi
          python current/scripts/ecosystem_diff.py "$baseline_report" "$RUNNER_TEMP/evaluation/current/diagnostics.json.gz" --output "$RUNNER_TEMP/evaluation/diff"
          cat "$RUNNER_TEMP/evaluation/diff/changes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Build release binaries
        shell: bash
        run: |
          cargo build --manifest-path current/Cargo.toml --release --locked -p seiso
          if test -n "$BASELINE_REF"; then
            cargo build --manifest-path baseline/Cargo.toml --release --locked -p seiso
          fi
      - name: Measure performance
        shell: bash
        run: |
          options=()
          if test -n "$BASELINE_REF"; then
            options+=(--baseline-binary baseline/target/release/seiso)
            if test -f baseline/scripts/benchmark_m2.py; then
              options+=(--enforce-regression)
            else
              printf '%s\n' 'Establishing the M2 baseline after absolute latency gates pass; M1 timing remains informational.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          python current/scripts/benchmark_m2.py \
            --binary current/target/release/seiso \
            --workdir "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/evaluation/performance.json" \
            --enforce-targets "${options[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          path: ${{ runner.temp }}/evaluation/
          if-no-files-found: ignore

  comment:
    needs: evaluate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: evaluation
          path: report
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            let body = fs.readFileSync('report/diff/changes.md', 'utf8');
            if (Buffer.byteLength(body, 'utf8') > 60000) {
              body = Buffer.from(body, 'utf8').subarray(0, 60000).toString('utf8') + '\n\nReport truncated.';
            }
            body += `\n\n[Complete workflow evidence](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.startsWith('<!-- seiso-ecosystem -->'));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

name: Build and publish distributions

on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish the verified wheels and source archive to PyPI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: seiso-distributions
  cancel-in-progress: false

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          command: build
          args: --release --locked --out dist
          manylinux: '2014'
      - name: Install and exercise the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          seiso --version
          seiso parse README.md --output-format json > parsed.json
          python -c "import json; r=json.load(open('parsed.json', encoding='utf-8')); assert len(r['files']) == 1 and not r['errors']"
      - if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          command: sdist
          args: --out dist
      - run: python scripts/verify_distributions.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  npm:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/prepare_npm.py --wheels dist
      - run: npm pack ./npm/seiso --pack-destination dist
      - name: Exercise the packed npm executable
        run: |
          npm exec --yes --package ./dist/seiso-*.tgz -- seiso --version
          npm exec --yes --package ./dist/seiso-*.tgz -- seiso parse README.md --output-format json > parsed.json
          python -c "import json; r=json.load(open('parsed.json', encoding='utf-8')); assert len(r['files']) == 1 and not r['errors']"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  pypi:
    if: inputs.publish_pypi
    needs: [wheels, npm]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

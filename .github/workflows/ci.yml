name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ runner.os == 'Linux' && 'clippy, rustfmt' || '' }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - if: runner.os == 'Linux'
        run: |
          cargo run --locked -p seiso -- check --output-format concise
          cargo run --locked -p seiso -- check --preview --output-format concise
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m unittest discover -s corpus -p 'test_*.py'
          python -m unittest discover -s corpus/evaluation -p 'test_*.py'

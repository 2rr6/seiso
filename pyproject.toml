[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "seiso"
dynamic = ["version"]
description = "A Markdown convention and linter for project docs written by AI and read by humans and agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Rust",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/scarletkc/seiso"
Issues = "https://github.com/scarletkc/seiso/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/seiso_cli/Cargo.toml"
strip = true
include = [{ path = "LICENSE", format = "sdist" }]

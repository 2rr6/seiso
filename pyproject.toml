[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "seiso"
dynamic = ["version"]
description = "A Markdown convention and linter for project docs written by AI and read by humans and agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "scarletkc" }]
keywords = ["markdown", "documentation", "linter", "docs-as-code", "ai-agents", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/scarletkc/seiso"
Documentation = "https://github.com/scarletkc/seiso/blob/main/docs/README.md"
Repository = "https://github.com/scarletkc/seiso"
Issues = "https://github.com/scarletkc/seiso/issues"
Changelog = "https://github.com/scarletkc/seiso/releases"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
include = [{ path = "LICENSE", format = "sdist" }]

[package]
name = "seiso"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A Markdown convention and linter for project docs written by AI and read by humans and agents"
readme = "../../README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]
categories = ["command-line-utilities", "development-tools"]
keywords = ["markdown", "documentation", "linter"]

[[bin]]
name = "seiso"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
seiso_config.workspace = true
seiso_diagnostics.workspace = true
seiso_md.workspace = true
seiso_rules.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true

[lints]
workspace = true
